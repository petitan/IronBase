[package]
name = "ironbase-bridge"
version = "0.1.5"
edition = "2021"
description = "STDIO to HTTP/HTTPS bridge for MCP IronBase Server"
license = "MIT"
authors = ["Petitan"]
repository = "https://github.com/petitan/IronBase"

[[bin]]
name = "ironbase-bridge"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "macros", "signal"] }

# HTTP client with TLS
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# URL parsing (BUG #7 fix)
url = "2"
