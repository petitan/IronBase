[package]
name = "ironbase-tui"
version.workspace = true
edition.workspace = true
description = "Intelligent TUI for IronBase NoSQL database"
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "ironbase-tui"
path = "src/main.rs"

[dependencies]
# IronBase core - DEPRECATED: using MCP protocol instead
# ironbase-core = { path = "../ironbase-core" }
# ironbase-backup = { path = "../ironbase-backup" }

# TUI framework
ratatui = "0.28"
crossterm = "0.28"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Config & paths
dirs = "5.0"
toml = "0.8"

# Scripting (Rhai)
rhai = { version = "1.18", features = ["sync"] }

# Async HTTP & MCP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync"] }
async-trait = "0.1"
