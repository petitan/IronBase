[package]
name = "tuti-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "TUTI-TUI - Intelligent TUI for IronBase NoSQL database"

[[bin]]
name = "tuti-tui"
path = "src/main.rs"

[dependencies]
# TUI framework
ratatui = "0.28"
crossterm = "0.29"

# CLI
clap = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Config & paths
dirs = "5.0"
toml = "0.8"

# Scripting (Rhai)
rhai = { workspace = true }

# Async HTTP & MCP client
reqwest = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }

# Clipboard
arboard = "3.4"
