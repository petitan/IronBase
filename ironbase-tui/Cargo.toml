[package]
name = "tuti-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "TUTI-TUI - Intelligent TUI for IronBase NoSQL database"
# ratatui 0.30.1+ requires Rust 1.88
rust-version = "1.88"

[lib]
name = "tuti_tui"
path = "src/lib.rs"

[[bin]]
name = "tuti-tui"
path = "src/main.rs"

[dependencies]
# TUI framework
ratatui = "0.30"
crossterm = "0.29"

# CLI
clap = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging (file only, never the terminal)
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Config & paths
dirs = "5.0"
toml = "0.8"

# Async HTTP & MCP client
reqwest = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }

# Clipboard
arboard = "3.4"
