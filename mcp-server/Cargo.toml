[package]
name = "mcp-ironbase-server"
version = "1.0.40"
edition = "2021"
authors = ["PeTitan Kft."]
description = "MCP server for IronBase document database"
license = "MIT"

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "signal"] }
parking_lot = "0.12"

# HTTP server (axum 0.7 with graceful shutdown support)
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# TLS support (using ring for better Windows compatibility - no cmake required)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

# Configuration
toml = "0.7"

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"

# Time handling
chrono = "0.4"

# Scripting engine
rhai = { version = "1.19", features = ["sync"] }

# Base64 encoding for scripts
base64 = "0.22"

# IronBase integration
ironbase-core = { path = "../ironbase-core" }

# Platform-specific service support
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[target.'cfg(unix)'.dependencies]
daemonize = "0.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "mcp-ironbase-server"
path = "src/main.rs"

[lib]
name = "mcp_ironbase"
path = "src/lib.rs"
