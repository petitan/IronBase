[package]
name = "mcp-ironbase-server"
version = "1.0.236"
edition = "2021"
authors = ["PeTitan Kft."]
description = "MCP server for IronBase document database"
license = "MIT"

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "signal"] }
parking_lot = "0.12"
dashmap = "6"  # Thread-safe HashMap for request tracking

# ACL / IP handling
ipnet = { version = "2", features = ["serde"] }

# HTTP server (axum 0.7 with graceful shutdown support)
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# TLS support (using ring for better Windows compatibility - no cmake required)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

# Configuration
toml = "0.7"

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
thiserror = "1.0"

# Time handling
chrono = "0.4"

# UUID generation
uuid = { version = "1.10", features = ["v4"] }

# Scripting engine
rhai = { version = "1.19", features = ["sync"] }

# Base64 encoding for scripts
base64 = "0.22"

# System information (memory stats)
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

# IronBase integration
ironbase-core = { path = "../ironbase-core" }

# Embedding support
memmap2 = "0.9"                    # Memory-mapped files for FastText
ureq = { version = "2.9", features = ["json"] }  # Blocking HTTP client for Ollama/OpenAI
rayon = "1.10"                     # Parallel processing for batch embeddings
log = "0.4"                        # Logging

# Platform-specific service support
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[target.'cfg(unix)'.dependencies]
daemonize = "0.5"
libc = "0.2"
tikv-jemallocator = { version = "0.6", features = ["background_threads_runtime_support"] }
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "mcp-ironbase-server"
path = "src/main.rs"

[lib]
name = "mcp_ironbase"
path = "src/lib.rs"
