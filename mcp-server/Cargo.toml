[package]
name = "mcp-ironbase-server"
version = "1.0.11"
edition = "2021"
authors = ["PeTitan Kft."]
description = "MCP server for IronBase document database"
license = "MIT"

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "signal"] }
parking_lot = "0.12"

# HTTP server (axum 0.7 with graceful shutdown support)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Configuration
toml = "0.7"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"

# IronBase integration
ironbase-core = { path = "../ironbase-core" }

# Platform-specific service support
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[target.'cfg(unix)'.dependencies]
daemonize = "0.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "mcp-ironbase-server"
path = "src/main.rs"

[lib]
name = "mcp_docjl"
path = "src/lib.rs"
