[package]
name = "mcp-ironbase-server"
version = "1.0.452"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MCP server for IronBase document database"

[dependencies]
# Core dependencies
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }

# ACL / IP handling
ipnet = { version = "2", features = ["serde"] }

# HTTP server (axum 0.7 with graceful shutdown support)
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# TLS support (using ring for better Windows compatibility - no cmake required)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

# Configuration
toml = { workspace = true }

# CLI argument parsing
clap = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"

# Error handling
thiserror = { workspace = true }

# Time handling
chrono = { workspace = true }

# UUID generation
uuid = { workspace = true }

# Scripting engine
rhai = { workspace = true }

# Base64 encoding for scripts
base64 = "0.22"

# System information (memory stats)
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

# IronBase integration
ironbase-core = { path = "../ironbase-core" }

# Embedding support
memmap2 = { workspace = true }
ureq = { version = "2.9", features = ["json"] }
rayon = { workspace = true }
log = { workspace = true }

# Text chunking for embed_document
text-splitter = { version = "0.18", features = ["markdown"] }

# Embedding cache
lru = { workspace = true }
sha2 = "0.10"
hex = "0.4"

# Platform-specific service support
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.52", features = [
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_Foundation",
] }

[target.'cfg(unix)'.dependencies]
daemonize = "0.5"
libc = "0.2"
tikv-jemallocator = { version = "0.6", features = ["background_threads_runtime_support"] }
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "mcp-ironbase-server"
path = "src/main.rs"

[lib]
name = "mcp_ironbase"
path = "src/lib.rs"
