# MCP DOCJL Server Configuration

[server]
host = "127.0.0.1"
port = 8080
# Max request body size (supports: B, KB, MB, GB)
# Default: 1GB - suitable for batch operations with large attachments
max_body_size = "1GB"
# Tool execution timeout in seconds
# Default: 60 - increase for long-running operations like db_compact
tool_timeout_secs = 3600

[database]
# Path to IronBase database file
path = "./docjl_storage.mlite"

# Path to audit log (optional)
# audit_log_path = "./audit.log"

# Require authentication (set to false for development)
require_auth = true

# API Keys
[[api_keys]]
key = "test_key_12345"
name = "Development Key"
allowed_commands = [
    "mcp_docjl_list_documents",
    "mcp_docjl_get_document",
    "mcp_docjl_insert_block",
    "mcp_docjl_update_block",
    "mcp_docjl_move_block",
    "mcp_docjl_delete_block",
    "mcp_docjl_list_headings",
    "mcp_docjl_search_blocks",
    "mcp_docjl_validate_references",
    "mcp_docjl_validate_schema",
    "mcp_docjl_get_audit_log",
]
allowed_documents = ["*"]  # Wildcard for all documents

[api_keys.rate_limit]
requests_per_minute = 100
writes_per_minute = 10

# Example: Restricted API key for read-only access
[[api_keys]]
key = "readonly_key_67890"
name = "Read-Only Key"
allowed_commands = [
    "mcp_docjl_list_documents",
    "mcp_docjl_get_document",
    "mcp_docjl_list_headings",
    "mcp_docjl_search_blocks",
]
allowed_documents = ["doc_1", "doc_2"]  # Only specific documents

[api_keys.rate_limit]
requests_per_minute = 50
writes_per_minute = 0  # No writes allowed

# Automatic storage compaction (reclaims dead bytes from updates/deletes).
# The whole section is optional — omitting it uses these same defaults.
[compaction]
enabled = true
# Trigger compaction when file_size / live_bytes reaches this ratio.
bloat_ratio_threshold = 2.0
# Never auto-compact files smaller than this (MB).
min_file_size_mb = 100
# How often the background timer checks the bloat ratio (seconds).
check_interval_secs = 300
# Minimum gap between two auto-compactions (seconds).
cooldown_secs = 1800
