name: Auto Tag on Version Change

on:
  push:
    branches:
      - master
    paths:
      - 'mcp-server/Cargo.toml'

jobs:
  auto-tag:
    name: Create Tag if Version Changed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.create_tag.outputs.TAG }}
      created: ${{ steps.create_tag.outputs.CREATED }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history to check tags

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -m1 '^version = ' mcp-server/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          TAG="v${{ steps.get_version.outputs.VERSION }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists"
          else
            echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist - will create"
          fi

      - name: Create and push tag
        id: create_tag
        run: |
          TAG="v${{ steps.get_version.outputs.VERSION }}"
          if [ "${{ steps.check_tag.outputs.TAG_EXISTS }}" == "false" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
            echo "CREATED=true" >> $GITHUB_OUTPUT
            echo "Created and pushed tag: $TAG"
          else
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
            echo "CREATED=false" >> $GITHUB_OUTPUT
          fi

  call-release:
    name: Trigger Release Build
    needs: auto-tag
    if: needs.auto-tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.auto-tag.outputs.tag }}
    permissions:
      contents: write
