name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on v1.0.0, v1.2.3, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.29)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release (called from auto-tag)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync version from tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
            VERSION=${VERSION#v}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "Setting MCP server version to $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" mcp-server/Cargo.toml
          # TUI has its own independent version - do NOT override
          cat mcp-server/Cargo.toml | head -5

      - name: Build MCP Server (Windows)
        run: |
          cd mcp-server
          cargo build --release

      - name: Build Backup CLI (Windows)
        run: cargo build --release -p ironbase-backup

      - name: Build TUI (Windows)
        run: |
          cd ironbase-tui
          cargo build --release

      - name: Build Bridge (Windows)
        run: |
          cd ironbase-bridge
          cargo build --release

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset -y
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Get version for MSI
        id: get_version_msi
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
            VERSION=${VERSION#v}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build MSI Installer
        shell: cmd
        run: |
          cd mcp-server
          if not exist target\wix mkdir target\wix
          candle.exe -dVersion=${{ steps.get_version_msi.outputs.VERSION }} -arch x64 -out target\wix\main.wixobj wix\main.wxs
          light.exe -ext WixUIExtension -out target\wix\IronBase-Setup-${{ steps.get_version_msi.outputs.VERSION }}.msi target\wix\main.wixobj

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v6
        with:
          name: ironbase-msi-windows
          path: mcp-server/target/wix/*.msi

      - name: Upload Windows MCP artifact
        uses: actions/upload-artifact@v6
        with:
          name: mcp-ironbase-server-windows
          path: target/release/mcp-ironbase-server.exe

      - name: Upload Windows Backup artifact
        uses: actions/upload-artifact@v6
        with:
          name: ironbase-backup-windows
          path: target/release/ironbase-backup.exe

      - name: Upload Windows TUI artifact
        uses: actions/upload-artifact@v6
        with:
          name: ironbase-tui-windows
          path: target/release/tuti-tui.exe

      - name: Upload Windows Bridge artifact
        uses: actions/upload-artifact@v6
        with:
          name: ironbase-bridge-windows
          path: target/release/ironbase-bridge.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync version from tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
            VERSION=${VERSION#v}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "Setting MCP server version to $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" mcp-server/Cargo.toml
          # TUI has its own independent version - do NOT override
          cat mcp-server/Cargo.toml | head -5

      - name: Build MCP Server (Linux)
        run: |
          cd mcp-server
          cargo build --release

      - name: Build Backup CLI (Linux)
        run: cargo build --release -p ironbase-backup

      - name: Build TUI (Linux)
        run: |
          cd ironbase-tui
          cargo build --release

      - name: Build Bridge (Linux)
        run: |
          cd ironbase-bridge
          cargo build --release

      - name: Upload Linux MCP artifact
        uses: actions/upload-artifact@v6
        with:
          name: mcp-ironbase-server-linux
          path: target/release/mcp-ironbase-server

      - name: Upload Linux Backup artifact
        uses: actions/upload-artifact@v6
        with:
          name: ironbase-backup-linux
          path: target/release/ironbase-backup

      - name: Upload Linux TUI artifact
        uses: actions/upload-artifact@v6
        with:
          name: ironbase-tui-linux
          path: target/release/tuti-tui

      - name: Upload Linux Bridge artifact
        uses: actions/upload-artifact@v6
        with:
          name: ironbase-bridge-linux
          path: target/release/ironbase-bridge

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync version from tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
            VERSION=${VERSION#v}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "Setting MCP server version to $VERSION"
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" mcp-server/Cargo.toml
          # TUI has its own independent version - do NOT override
          cat mcp-server/Cargo.toml | head -5

      - name: Build MCP Server (macOS)
        run: |
          cd mcp-server
          cargo build --release

      - name: Build Backup CLI (macOS)
        run: cargo build --release -p ironbase-backup

      - name: Build TUI (macOS)
        run: |
          cd ironbase-tui
          cargo build --release

      - name: Build Bridge (macOS)
        run: |
          cd ironbase-bridge
          cargo build --release

      - name: Upload macOS MCP artifact
        uses: actions/upload-artifact@v6
        with:
          name: mcp-ironbase-server-macos
          path: target/release/mcp-ironbase-server

      - name: Upload macOS Backup artifact
        uses: actions/upload-artifact@v6
        with:
          name: ironbase-backup-macos
          path: target/release/ironbase-backup

      - name: Upload macOS TUI artifact
        uses: actions/upload-artifact@v6
        with:
          name: ironbase-tui-macos
          path: target/release/tuti-tui

      - name: Upload macOS Bridge artifact
        uses: actions/upload-artifact@v6
        with:
          name: ironbase-bridge-macos
          path: target/release/ironbase-bridge

  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # MCP Server - Windows
          cp artifacts/mcp-ironbase-server-windows/mcp-ironbase-server.exe \
             release-assets/mcp-ironbase-server-windows.exe

          # MCP Server - Linux
          cp artifacts/mcp-ironbase-server-linux/mcp-ironbase-server \
             release-assets/mcp-ironbase-server-linux
          chmod +x release-assets/mcp-ironbase-server-linux

          # MCP Server - macOS
          cp artifacts/mcp-ironbase-server-macos/mcp-ironbase-server \
             release-assets/mcp-ironbase-server-macos
          chmod +x release-assets/mcp-ironbase-server-macos

          # Backup CLI - Windows
          cp artifacts/ironbase-backup-windows/ironbase-backup.exe \
             release-assets/ironbase-backup-windows.exe

          # Backup CLI - Linux
          cp artifacts/ironbase-backup-linux/ironbase-backup \
             release-assets/ironbase-backup-linux
          chmod +x release-assets/ironbase-backup-linux

          # Backup CLI - macOS
          cp artifacts/ironbase-backup-macos/ironbase-backup \
             release-assets/ironbase-backup-macos
          chmod +x release-assets/ironbase-backup-macos

          # TUI - Windows (binary is named tuti-tui, renamed on release)
          cp artifacts/ironbase-tui-windows/tuti-tui.exe \
             release-assets/ironbase-tui-windows.exe

          # TUI - Linux
          cp artifacts/ironbase-tui-linux/tuti-tui \
             release-assets/ironbase-tui-linux
          chmod +x release-assets/ironbase-tui-linux

          # TUI - macOS
          cp artifacts/ironbase-tui-macos/tuti-tui \
             release-assets/ironbase-tui-macos
          chmod +x release-assets/ironbase-tui-macos

          # Bridge - Windows
          cp artifacts/ironbase-bridge-windows/ironbase-bridge.exe \
             release-assets/ironbase-bridge-windows.exe

          # Bridge - Linux
          cp artifacts/ironbase-bridge-linux/ironbase-bridge \
             release-assets/ironbase-bridge-linux
          chmod +x release-assets/ironbase-bridge-linux

          # Bridge - macOS
          cp artifacts/ironbase-bridge-macos/ironbase-bridge \
             release-assets/ironbase-bridge-macos
          chmod +x release-assets/ironbase-bridge-macos

          # Copy installer scripts
          cp mcp-server/scripts/install.ps1 release-assets/
          cp mcp-server/scripts/install.sh release-assets/
          chmod +x release-assets/install.sh

          # Windows MSI Installer
          cp artifacts/ironbase-msi-windows/*.msi release-assets/ || echo "MSI not found, skipping"

          ls -la release-assets/

      - name: Get version from tag
        id: get_version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "VERSION=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: IronBase MCP Server ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, '-alpha') || contains(steps.get_version.outputs.VERSION, '-beta') || contains(steps.get_version.outputs.VERSION, '-rc') }}
          generate_release_notes: true
          files: |
            release-assets/mcp-ironbase-server-windows.exe
            release-assets/mcp-ironbase-server-linux
            release-assets/mcp-ironbase-server-macos
            release-assets/ironbase-backup-windows.exe
            release-assets/ironbase-backup-linux
            release-assets/ironbase-backup-macos
            release-assets/ironbase-tui-windows.exe
            release-assets/ironbase-tui-linux
            release-assets/ironbase-tui-macos
            release-assets/ironbase-bridge-windows.exe
            release-assets/ironbase-bridge-linux
            release-assets/ironbase-bridge-macos
            release-assets/IronBase-Setup-*.msi
            release-assets/install.ps1
            release-assets/install.sh
          body: |
            ## IronBase ${{ steps.get_version.outputs.VERSION }}

            ### Windows Installation Options

            | Method | File | Description |
            |--------|------|-------------|
            | **MSI Installer** | `IronBase-Setup-${{ steps.get_version.outputs.VERSION }}.msi` | GUI wizard with Windows Service |
            | **PowerShell** | `install.ps1` | Command-line installation |
            | **Standalone** | `mcp-ironbase-server-windows.exe` | Portable, no installation |

            ### MCP Server Downloads

            | Platform | File | Install |
            |----------|------|---------|
            | Windows | `mcp-ironbase-server-windows.exe` | MSI or `.\install.ps1` |
            | Linux | `mcp-ironbase-server-linux` | `sudo ./install.sh` |
            | macOS | `mcp-ironbase-server-macos` | `sudo ./install.sh` |

            ### Backup CLI Downloads

            | Platform | File |
            |----------|------|
            | Windows | `ironbase-backup-windows.exe` |
            | Linux | `ironbase-backup-linux` |
            | macOS | `ironbase-backup-macos` |

            ### TUI (Terminal UI) Downloads

            | Platform | File |
            |----------|------|
            | Windows | `ironbase-tui-windows.exe` |
            | Linux | `ironbase-tui-linux` |
            | macOS | `ironbase-tui-macos` |

            ### MCP Bridge (STDIO to HTTP proxy for Claude Desktop)

            | Platform | File |
            |----------|------|
            | Windows | `ironbase-bridge-windows.exe` |
            | Linux | `ironbase-bridge-linux` |
            | macOS | `ironbase-bridge-macos` |

            ### Quick Install MCP Server (Windows)

            ```powershell
            # Download and run installer (as Administrator)
            irm https://github.com/petitan/IronBase/releases/latest/download/install.ps1 | iex
            ```

            ### Quick Install MCP Server (Linux/macOS)

            ```bash
            # Download and run installer
            curl -sSL https://github.com/petitan/IronBase/releases/latest/download/install.sh | sudo bash
            ```

            ### Backup CLI Usage

            ```bash
            # Create full backup
            ironbase-backup backup --db mydata.mlite --output ./backups --full

            # Create incremental backup
            ironbase-backup backup --db mydata.mlite --output ./backups

            # Restore from backups
            ironbase-backup restore --dir ./backups --output restored.mlite

            # Verify backup integrity
            ironbase-backup verify --dir ./backups
            ```

            ### TUI Usage

            ```bash
            # Connect to HTTP mode MCP server
            ironbase-tui --http http://localhost:8080

            # Connect via stdio (spawns MCP server)
            ironbase-tui --server ./mcp-ironbase-server --db mydata.mlite
            ```

            ### Manual Installation

            1. Download the appropriate binary for your platform
            2. Run `./mcp-ironbase-server install` (as admin/root)
            3. Start the service: `sc start IronBaseService` (Windows) or `systemctl start ironbase` (Linux)
