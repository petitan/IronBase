name: Test Windows Build

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test-windows:
    name: Test on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Build
        run: maturin build --release --manifest-path bindings/python/Cargo.toml

      - name: Install wheel
        run: |
          pip install --find-links=target/wheels ironbase

      - name: Test import
        run: python -c "import ironbase; print('Import successful')"

      - name: Run Rust tests
        run: cargo test --workspace --verbose

      - name: Basic functionality test
        shell: bash
        run: |
          cat > /tmp/test_basic.py << 'PYEOF'
          from ironbase import IronBase
          import tempfile
          import os

          # Create temporary database
          with tempfile.TemporaryDirectory() as tmpdir:
              db_path = os.path.join(tmpdir, 'test.mlite')
              db = IronBase(db_path)

              # Test CRUD operations
              collection = db.collection('test')
              result = collection.insert_one({'msg': 'Windows test', 'value': 42})
              assert result['acknowledged'] == True

              # Test query
              doc = collection.find_one({'msg': 'Windows test'})
              assert doc is not None
              assert doc['value'] == 42

              # Test update
              update_result = collection.update_one(
                  {'msg': 'Windows test'},
                  {'$set': {'value': 100}}
              )
              assert update_result['modified_count'] == 1

              # Test delete
              delete_result = collection.delete_one({'msg': 'Windows test'})
              assert delete_result['deleted_count'] == 1

              print('All Windows functionality tests passed!')
          PYEOF
          python /tmp/test_basic.py

      - name: Test file persistence
        shell: bash
        run: |
          cat > /tmp/test_persist.py << 'PYEOF'
          from ironbase import IronBase
          import tempfile
          import os

          with tempfile.TemporaryDirectory() as tmpdir:
              db_path = os.path.join(tmpdir, 'persist.mlite')

              # Write data
              db = IronBase(db_path)
              coll = db.collection('persist')
              coll.insert_one({'msg': 'persistence test'})
              db.close()  # Explicitly flush and close

              # Reopen and verify
              db = IronBase(db_path)
              coll = db.collection('persist')
              doc = coll.find_one({})
              assert doc is not None, "Document not found after reopen!"
              assert doc['msg'] == 'persistence test'

              print('Windows file persistence test passed!')
          PYEOF
          python /tmp/test_persist.py

      - name: Build MCP Server
        run: cargo build --release --manifest-path mcp-server/Cargo.toml

      - name: Prepare Windows release package
        shell: bash
        run: |
          mkdir -p release-windows
          cp mcp-server/target/release/mcp-ironbase-server.exe release-windows/
          cp mcp-server/scripts/install.ps1 release-windows/
          echo "IronBase MCP Server for Windows" > release-windows/README.txt
          echo "" >> release-windows/README.txt
          echo "Installation:" >> release-windows/README.txt
          echo "  1. Run PowerShell as Administrator" >> release-windows/README.txt
          echo "  2. cd to this folder" >> release-windows/README.txt
          echo "  3. Run: .\\install.ps1" >> release-windows/README.txt
          echo "" >> release-windows/README.txt
          echo "Uninstall:" >> release-windows/README.txt
          echo "  .\\install.ps1 -Uninstall" >> release-windows/README.txt

      - name: Upload Windows release package
        uses: actions/upload-artifact@v4
        with:
          name: ironbase-mcp-server-windows
          path: release-windows/
          retention-days: 30
