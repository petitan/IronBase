name: Rust CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Run doc tests
        run: cargo test --doc

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

      - name: Re-evaluate pyo3 advisory ignores (.cargo/audit.toml guard)
        # The pyo3 RUSTSEC-2026-0176 / RUSTSEC-2026-0177 ignores in .cargo/audit.toml
        # are justified ONLY because bindings/python never uses the vulnerable APIs
        # (PyList/PyTuple iterator .nth()/.nth_back(); PyCFunction::new_closure). The
        # ignore silences the advisory for the WHOLE crate, so if any of these symbols
        # appears here the justification no longer holds — fail loudly so the advisory
        # is re-evaluated (and the ignore narrowed or pyo3 upgraded to >=0.29).
        run: |
          if git grep -nE '\.nth(_back)?\(|new_closure' -- bindings/python; then
            echo "::error::Silenced pyo3 advisory symbol found in bindings/python — re-evaluate the RUSTSEC-2026-0176 / RUSTSEC-2026-0177 ignore in .cargo/audit.toml."
            exit 1
          fi
          echo "OK: no silenced pyo3 advisory symbols in bindings/python."

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
