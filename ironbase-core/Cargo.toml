[package]
name = "ironbase-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure Rust core library for IronBase - embedded document database"

[features]
default = ["parallel"]
parallel = ["rayon"]

[lib]
name = "ironbase_core"
crate-type = ["rlib"]

[dependencies]
# Workspace dependencies (pure Rust only, NO PyO3)
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bincode = { workspace = true }
lazy_static = { workspace = true }
crc32fast = "1.4"  # For WAL checksums
lru = "0.12"       # For query result caching
regex = "1.10"     # For full $regex operator support
strsim = "0.11"    # For fuzzy text search ($fuzzy operator)
fs2 = "0.4"        # Cross-platform file locking
rust-stemmers = "1.2"           # For full-text search stemming (15+ languages)
unicode-normalization = "0.1"   # For accent folding in full-text search
rayon = { version = "1.10", optional = true }  # For parallel iteration (default: enabled)
tracing = "0.1"    # For progress logging during long operations

[target.'cfg(unix)'.dependencies]
libc = "0.2"       # For process existence check (kill(pid, 0))

[dev-dependencies]
tempfile = { workspace = true }
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false
